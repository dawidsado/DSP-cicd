name: Datasphere Transport PoC

# PR do main  -> dry-run (plan): widać co się wdroży, nic nie rusza tenanta
# push do main -> realne wdrożenie 3 obiektów do przestrzeni docelowej
on:
  push:
    branches: [main]
    paths: ["objects/**", "scripts/**"]
  pull_request:
    paths: ["objects/**", "scripts/**"]
  workflow_dispatch: {}

jobs:
  transport:
    runs-on: ubuntu-latest
    env:
      SPACE_TARGET: ${{ vars.SPACE_TARGET }}
      SECRETS_FILE: config/secrets.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*" #najnowsza wersja node

      - name: Install Datasphere CLI + jq
        run: |
          npm install -g @sap/datasphere-cli
          datasphere --version
          sudo apt-get install -y jq

      - name: Materialize secrets from repo secret
        run: |
          mkdir -p config
          printf '%s' "$DSP_SECRETS" > config/secrets.json
        env:
          DSP_SECRETS: ${{ secrets.DSP_SECRETS }}
      
      - name: Initialize CLI cache
        run: datasphere config cache init --host "https://all-for-one-3.eu10.hcs.cloud.sap" --secrets-file config/secrets.json

      - name: Dry-run (plan) on PR
        if: github.event_name == 'pull_request'
        run: DRY_RUN=1 ./scripts/deploy.sh

      - name: Deploy on push to main
        if: github.event_name != 'pull_request'
        id: deploy
        run: ./scripts/deploy.sh | tee deploy_output.txt

      # --- podsumowanie deployu w zakładce Actions (zamiast Teams) ---
      - name: Deployment summary
        if: github.event_name != 'pull_request' && always()
        run: |
          {
            echo "## 🚚 Datasphere Transport — podsumowanie"
            echo ""
            echo "**Przestrzeń docelowa:** \`${SPACE_TARGET}\`"
            echo ""
            if [ "${{ job.status }}" = "success" ]; then
              echo "**Status:** ✅ wdrożenie zakończone powodzeniem"
            else
              echo "**Status:** ❌ wdrożenie zakończone błędem"
            fi
            echo ""
            echo "### Szczegóły"
            echo '```'
            # wyczyść kody kolorów ANSI z outputu deploya
            sed 's/\x1b\[[0-9;]*m//g' deploy_output.txt 2>/dev/null || echo "brak outputu"
            echo '```'
            echo ""
            echo "_Uruchomił: ${{ github.actor }} · commit: ${{ github.sha }}_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup secrets
        if: always()
        run: rm -f config/secrets.json
